[package]
name = "fuzz-targets-honggfuzz"
version = "0.1.0"
authors = ["The rust-fuzz Project Developers"]
edition = "2021"

[dependencies]
fuzz-targets = { path = "../targets/rust" }
walkdir = "2"
honggfuzz = "0.5"
rand = "0.6"
ssz = { package = "ethereum_ssz", version = "0.9.0" }
ssz_derive = { package = "ethereum_ssz_derive", version = "0.9.0" }
# Use relative paths to local lighthouse sub-crates (no user-specific absolute paths)
state_processing = { path = "../../../lighthouse/consensus/state_processing" }
types = { path = "../../../lighthouse/consensus/types" }

#[patch.crates-io]
# Use published crates for hashing/ssz/tree_hash to match latest Lighthouse
# tree_hash = "0.10.0"
# tree_hash_derive = "0.10.0"
# ssz_types = "0.11.0"

[profile.release]
# Force consistent codegen to avoid multiple incompatible rand 0.6 artifacts
# This fixes linking errors with GNU_PROPERTY_TYPE on Ubuntu 18.04
codegen-units = 1
