[package]
name = "fuzz-targets-libfuzzer"
version = "0.1.0"
authors = ["The rust-fuzz Project Developers"]
edition = "2021"

[package.metadata]
cargo-fuzz = true

# Prevent this from interfering with workspaces
[workspace]
members = ["."]

[dependencies]
libfuzzer-sys = "0.3"
walkdir = "2"
lazy_static = "1.3.0"
rand = "0.6"
fuzz-targets = {path = "../../targets/rust"}
# Use crates.io for SSZ crates; keep lighthouse path deps for types/state_processing
ssz = { package = "ethereum_ssz", version = "0.9" }
ssz_derive = { package = "ethereum_ssz_derive", version = "0.9" }
types = { git = "file:///Users/hanzhi/Documents/Research/alma/eth2fuzz/lighthouse", package = "types" }
state_processing = { git = "file:///Users/hanzhi/Documents/Research/alma/eth2fuzz/lighthouse", package = "state_processing" }

# Grandine direct-call deps (local checkout under repo root ./grandine)
gtypes = { git = "file:///Users/hanzhi/Documents/Research/alma/eth2fuzz/grandine", package = "types" }
gssz = { git = "file:///Users/hanzhi/Documents/Research/alma/eth2fuzz/grandine", package = "ssz" }
gtrans = { git = "file:///Users/hanzhi/Documents/Research/alma/eth2fuzz/grandine", package = "transition_functions" }
gpubkey_cache = { git = "file:///Users/hanzhi/Documents/Research/alma/eth2fuzz/grandine", package = "pubkey_cache" }
bls = { git = "file:///Users/hanzhi/Documents/Research/alma/eth2fuzz/grandine", package = "bls", features = ["blst"] }
ghelper = { git = "file:///Users/hanzhi/Documents/Research/alma/eth2fuzz/grandine", package = "helper_functions" }

[patch.crates-io]
# (no local patches; resolve via fuzz-targets dependencies)
# web3 = { git = "https://github.com/tomusdrw/rust-web3" }



